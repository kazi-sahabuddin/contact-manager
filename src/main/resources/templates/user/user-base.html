<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Base page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>
<body>

<!--Navbar start-->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Contact Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/home}">Home</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link"><span th:text="${user.name}"></span></a>
                </li>
                <li class="nav-item">

                    <form th:action="@{/logout}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="nav-link" type="submit">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
<!--Navbar end-->

<div class="sidebar">

    <span onclick="toggleSidebar()" class="crossBtn">&times;</span>

    <a href="#" th:href="@{/user/index}" class="item"> <i class="bi bi-house-fill"></i> Home</a>
    <a href="#" class="item"> <i class="bi bi-journal-text"></i> View Contacts</a>
    <a href="#" th:href="@{/user/add-contact}" class="item"> <i class="bi bi-plus-circle-fill"></i> Add Contact</a>
    <a href="#" class="item"> <i class="bi bi-pencil-square"></i> Update Contact</a>
    <a href="#" class="item"> <i class="bi bi-person-circle"></i> Your Profile</a>
    <a href="#" class="item"> <i class="bi bi-gear-wide-connected"></i> Settings</a>
    <a href="#" class="item" onclick="document.getElementById('sign-out-form').submit(); return false;">
        <i class="bi bi-box-arrow-right"></i>
        Sign Out
    </a>

    <form th:action="@{/logout}" method="post" id="sign-out-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    </form>


    <div class="divider"></div>
</div>

<div class="content">
    <i onclick="toggleSidebar()" style="font-size: 36px;cursor: pointer" class="bi bi-list"></i>
    <div th:replace="${content}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.slim.min.js" integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
