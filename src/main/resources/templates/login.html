<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>This is login Page</title>
</head>
<body>
<section>
    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="my-card">

                    <div th:if="${param.error}" class="alert alert-danger">
                        Invalid Username or password
                    </div>
                    <div th:if="${param.logout}" class="alert alert-danger">
                        You have been logged out
                    </div>
                    <div class="container text-center">
                        <img style="width: 80px" th:src="@{/images/key.png}"/>
                    </div>

                    <h1 class="text-center">Login Here !!</h1>
                    <form th:action="@{/sign-in}" action="#" method="post">

                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="email" name="username" class="form-control" id="username" placeholder="Enter your email or username">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" id="password"  placeholder="Enter your password">
                        </div>

                        <div class="container text-center">
                            <button type="submit" class="btn btn-primary d-block mb-2 w-100">Sign In</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div>


</section>

</body>
</html>
